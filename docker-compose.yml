# Scout: web (nginx + built PWA), api (FastAPI), db (Postgres).
# Put a CDN / TLS terminator in front of `web`: phones only allow camera access over HTTPS.
services:
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/scout
    volumes:
      - ./data/bundles:/app/data/bundles
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
