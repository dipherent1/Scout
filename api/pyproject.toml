[project]
name = "scout-api"
version = "0.1.0"
description = "Scout backend: scan fallback, enrichment, streamed copilot chat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
